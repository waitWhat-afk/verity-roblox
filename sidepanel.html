<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verity AI Panel</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#202123;--muted:#777;--line:#e9e9e9;--hover:#f4f4f4;--menu:#fff;--accent:#202123;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:10;background:var(--bg)}
.picker{position:relative;flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
.trigger{display:flex;align-items:center;gap:9px;max-width:100%;height:38px;padding:0 11px;border-radius:var(--radius);font-weight:600;font-size:15px}
.trigger:hover,.trigger[aria-expanded=true],.tool:hover{background:var(--hover)}
.mark{display:grid;place-items:center;width:22px;height:22px;font-size:20px;line-height:1;color:var(--accent);flex:none}
.chevron{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-4px 3px 0 4px;transition:transform .15s}
.trigger[aria-expanded=true] .chevron{transform:rotate(225deg);margin-top:4px}
.menu{position:absolute;left:0;top:calc(100% + 7px);width:min(260px,calc(100vw - 20px));padding:6px;background:var(--menu);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #00000019,0 2px 6px #00000008}
[hidden]{display:none!important}.menu-label{padding:8px 10px 7px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.04em}
.option{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;border-radius:9px;text-align:left;font-weight:500}
.option:hover,.option:focus-visible{background:var(--hover)}.option[aria-checked=true]{background:var(--hover)}
.option .mark{color:var(--fg)}.check{margin-left:auto;color:var(--fg);font-size:15px;visibility:hidden}.option[aria-checked=true] .check{visibility:visible}
.tool{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--muted);flex:none}.tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;position:relative}iframe{display:block;border:0;width:100%;height:100%;position:absolute;inset:0;background:var(--bg)}
@media(prefers-reduced-motion:reduce){.chevron{transition:none}}
.tool:disabled{opacity:.55;cursor:wait}.share{display:inline-flex;gap:6px;width:auto;height:34px;padding:0 10px;border:1px solid var(--line);background:var(--hover);color:var(--fg);font-size:12px;font-weight:600;white-space:nowrap}.share:hover{border-color:var(--muted);filter:brightness(.97)}.share svg{width:16px;height:16px}@media(max-width:320px){header{gap:2px;padding:8px 6px}.trigger{padding:0 5px;gap:5px;font-size:14px}.share{padding:0 7px}.tool:not(.share){width:28px}}
</style>
</head>
<body>
<header>
<div class="picker">
<button id="provider" class="trigger" aria-label="Switch AI provider" aria-haspopup="menu" aria-expanded="false" aria-controls="provider-menu"><span id="provider-mark" class="mark" aria-hidden="true">◎</span><span id="provider-name">ChatGPT</span><span class="chevron" aria-hidden="true"></span></button>
<div id="provider-menu" class="menu" role="menu" aria-label="AI provider" hidden>
<div class="menu-label" aria-hidden="true">SWITCH AI</div>
<button class="option" role="menuitemradio" aria-checked="true" data-provider="chatgpt" tabindex="-1"><span class="mark" aria-hidden="true">◎</span><span>ChatGPT</span><span class="check" aria-hidden="true">✓</span></button>
<button class="option" role="menuitemradio" aria-checked="false" data-provider="claude" tabindex="-1"><span class="mark" aria-hidden="true">✳</span><span>Claude</span><span class="check" aria-hidden="true">✓</span></button>
<button class="option" role="menuitemradio" aria-checked="false" data-provider="gemini" tabindex="-1"><span class="mark" aria-hidden="true">✦</span><span>Gemini</span><span class="check" aria-hidden="true">✓</span></button>
<button class="option" role="menuitemradio" aria-checked="false" data-provider="grok" tabindex="-1"><span class="mark" aria-hidden="true">𝕏</span><span>Grok</span><span class="check" aria-hidden="true">✓</span></button>
</div>
</div>
<button id="share" class="tool share" title="Paste current tab link into chat" aria-label="Share tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/></svg><span>Share tab</span></button>
<button id="reload" class="tool" title="Reload current AI" aria-label="Reload current AI"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 7v5"/></svg></button>
<button id="open" class="tool" title="Open current AI in a browser tab" aria-label="Open current AI in a browser tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg></button>
</header>
<main id="frames"></main>
<script src="sidepanel.js"></script>
</body>
</html>
